[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-wizard"
version = "0.1.0"
description = "PDF Wizard fills fillable (AcroForm) PDFs from your documents, with evidence for every value."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
# Compatible ranges here; exact versions are locked in uv.lock.
dependencies = [
    "pypdf>=6.19,<7",
    "cryptography>=50.0,<51",
    "google-genai>=2.28,<3",
    "pydantic>=2.13,<3",
    "fastapi>=0.142,<0.143",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32,<0.1",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",
    "reportlab>=5.0,<6",
    "pillow>=12.0,<13",
    "faker>=40.0,<41",
    "pip-audit>=2.10,<3",
]

[project.scripts]
pdf-wizard = "pdf_wizard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_wizard = ["web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
